name: Deployff

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: checkout_code
      uses: actions/checkout@v4

    - name: ssh
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{secrets.SSH_HOST}}
        username: shubhu
        key: ${{secrets.SSH_KEY}}
        script: |
          cd /Users/shubhu/Desktop/pipelineTest/gitactions
          git pull
          export NVM_DIR=~/.nvm
          source ~/.nvm/nvm.sh
          npm install 
          pm2 restart 1 
